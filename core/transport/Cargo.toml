[package]
name = "rooms-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Transport abstraction: QUIC/libp2p, relay, local mesh adapters"

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
libp2p = { workspace = true }
snow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "rooms-relay"
path = "src/bin/rooms_relay.rs"

[dev-dependencies]
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rooms-identity = { path = "../identity" }
rooms-proto = { workspace = true }
rooms-storage = { workspace = true }
rooms-sync = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
